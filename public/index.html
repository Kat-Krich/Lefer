<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Lefer</title>
        <!--Estilos-->
        <link href="./estilos/estiloIndex.css" rel="stylesheet">
        <link href="./estilos/estiloGenerico.css" rel="stylesheet">


        <link rel="shortcut icon" href="imagens/logo.png" type="image/png">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav id = "MenuLateral">
            <button id="btnBusca" onclick="mostrarMenu(this.id) " class="btnNavegacao">
                <img src ="imagens/lupa.png" class="imagem">
            </button>
            <button id="btnHome" onclick="mostrarMenu(this.id)" class="btnNavegacao">
                <img src ="imagens/home.png" class="imagem">
            </button>
            <button id="btnMetas" onclick="mostrarMenu(this.id)" class="btnNavegacao">
                <img src ="imagens/target.png" class="imagem">  
            </button>
            <button id="btnBiblioteca" onclick="mostrarMenu(this.id)" class="btnNavegacao">
                <img src ="imagens/biblioteca.png" class="imagem">      
            </button>
            <button id="btnSair" class="btnNavegacao">
                <a href = "loginSingUp.html">
                    <img src = "imagens/exit.png" class="imagem">
                </a>
            </button>
        </nav>      
        <main id = "Main">
            <div id = "Ajuda">
                <h3 class = "texto">Precisa de ajuda?</h3>
                <a href = "index.html">
                    <img src = "imagens/ajuda.png" width="80px" height="80px" id = iconeAjuda>
                </a>
            </div>
            <div id="InfoLivro">
                <div id="detalhes_livro" style="display:none;">
        
                </div>
            </div>

            <section id = "Home" class="secao">
                <div id = "Intro">
                    <h1 class = "texto" id = "BemVindo">Bem Vindo</h1>
                    <img src = "imagens/logoLefer.png" width="auto" height="auto" id = "Logo">
                </div>
                <div id="MeusLivros">
                    <h2  class = "texto">Meus Livros</h2>
                
                    <div class = "livros" id = "meus_livros">
                        <button id="cadastrarLivro" onclick="mostrarMenu('btnBusca')">&plus;</button>
                    </div>
                </div>
                <div id="Recomendacoes" class="blocos">
                    <h2  class = "texto">Recomendações</h2>
                    <div class = "livros" id="lista_recomendacoes">
                        
                    </div>
                </div>
            </section>
            <section id="Busca" class="secao">
                
                <img src = "imagens/logoLefer.png" width="auto" height="150px" class="logo">
                
                
                <div id = "boxBusca" class="blocos">
                    <div id = "textoBusca">
                        <input id="campoBusca" placeholder="Digite o título ou autor" class="caixaTexto" onkeypress="if(event.key === 'Enter') buscarLivros();">
                        <img src = "imagens/lupa.png" width="auto" height="35px" onclick="buscarLivros()"> 
                    </div>

                    
                    <div class="livros" id="resultBusca">
                        
                        
                    </div>
                </div>

                
            </section>
            <section id="Metas" class="secao">
                <img src="imagens/logoLefer.png" width="auto" height="150px" class="logo">
    
                <h2 class="texto">Minhas Metas</h2>
                
                <div class="livros container-metas">
                    
                    <div class="card-meta">
                        <div class="item-meta">
                            <input type="checkbox" checked id="meta1_1">
                            <label for="meta1_1" class="concluido">Terminar de ler O Manto Escarlate</label>
                        </div>
                        <div class="item-meta">
                            <input type="checkbox" id="meta1_2">
                            <label for="meta1_2">Terminar de ler O Amor Maduro</label>
                        </div>
                        <p class="prazo-meta">Prazo: 20/04/2026</p>
                        
                        <div class="progresso-circular p50">
                            <span>50%</span>
                        </div>
                    </div>

                    <div class="card-meta">
                        <div class="item-meta">
                            <input type="checkbox" id="meta2_1">
                            <label for="meta2_1">Ler Coraline até a página 50</label>
                        </div>
                        <p class="prazo-meta">Prazo: 27/04/2026<br>Até 21:30</p>
                        
                        <div class="progresso-circular p0">
                            <span>0%</span>
                        </div>
                    </div>

                    <div class="card-meta">
                        <div class="item-meta">
                            <input type="checkbox" id="meta3_1">
                            <label for="meta3_1">Ler 100 livros</label>
                        </div>
                        <p class="prazo-meta">Sem prazo</p>
                        
                        <div class="progresso-circular p0">
                            <span>0%</span>
                        </div>
                    </div>

                    <button id="adicionarMeta" class="btn-adicionar-meta">&plus;</button>

                </div>
            </section>
            <section id="Biblioteca" class="secao">
                <img src="imagens/logo.png" width="200px" height="200px" class="logo">

                <div id="conteudo_biblioteca">
                </div>

            </section>

        </main>
        <script src="/script.js"></script>
    </body>
</html>
