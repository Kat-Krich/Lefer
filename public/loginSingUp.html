<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Lefer</title>    

        <link href="estilos/estiloGenerico.css" rel="stylesheet">
        <link href="estilos/loginSingUpStyle.css" rel="stylesheet">

        <link rel="shortcut icon" href="imagens/logo.png" type="image/png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <main id="Main">
            <div id="imagemEsquerda">
                <header>
                    <div class="topo">
                        <h1>Lefer</h1>  
                        <img src="imagens/logo.png" class="imagem">
                    </div>
                    <h2>Organize melhor suas leituras com Lefer</h2>
                </header>
                <nav>
                    <button type="button" onclick="mostrarLogin()" id="login" class="botao">Login</button>
                    <button type="button" onclick="mostrarCadastro()" id="cadastro" class="botao">Cadastre-se</button>
                </nav>                
            </div>

            <div id="imagemDireita">
                <img src="imagens/biblioteca.webp" class="imagem">
            </div>
            <section id="Login" class="telaPreta CadastroLogin ">
                <div class="card-conteudo">
                    <div class="textoBtnFechar">
                        <h2 class="texto">Login</h2>
                        <button class="btn-fechar" onclick="fecharLogin()">&times;</button>
                    </div>
                    <div class="tipoMaisCaixaTexto">
                        <p>E-mail:</p>
                        <input placeholder="@gmail.com" type="email" class="caixaTexto">
                    </div>
                    <div class="tipoMaisCaixaTexto">
                        <p>Senha:</p>
                        <input placeholder="senha" type="password" class="caixaTexto">                        
                    </div>
                    <a href="index.html" id="linkIndex"><button type="submit" class="botao">Entrar</button></a>
                    <p>Caso não tenha se cadastrado ainda</p>
                    <a id="goToCadastro" onclick="fecharLogin(); mostrarCadastro()">clique aqui</a>
                </div>
            </section>
            <section id="Cadastro" class="telaPreta CadastroLogin ">
                <div class="card-conteudo">
                    <div class="textoBtnFechar">
                        <h2 class="texto">Cadastro</h2>
                        <button class="btn-fechar" onclick="fecharCadastro()">&times;</button>
                    </div>
                    <div class="tipoMaisCaixaTexto">
                        <p>Usuário:</p>
                        <input placeholder="user123" type="email" class="caixaTexto">
                    </div>
                    <div class="tipoMaisCaixaTexto">
                        <p>E-mail:</p>
                        <input placeholder="@gmail.com" type="email" class="caixaTexto">
                    </div>
                    <div class="tipoMaisCaixaTexto">
                        <p>Senha:</p>
                        <input placeholder="senha" type="password" class="caixaTexto">                        
                    </div>
                    <div class="tipoMaisCaixaTexto">
                        <p class="caixaData">Data de Nascimento:<input type="date" class="caixaTexto" id="data"></p>   
                                     
                    </div>
                    <a href="index.html"><button type="submit" class="botao">Entrar</button></a>
                </div>
            </section>
        </main>
        <script type="text/javascript" src="script.js"></script>
    </body>
</html>
